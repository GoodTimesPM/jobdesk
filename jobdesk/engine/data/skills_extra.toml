# Skills the posting reader knows beyond vocabulary.toml, written by hand.
#
# The generated skills_library.json (O*NET and GitHub topics) is strong on
# software names and weak on everything else a posting asks for: the
# certifications, the compliance frameworks, accounting and healthcare work,
# and IT operations. This file covers those, and it wins over the generated
# file for any alias both have.
#
# Each term:
#   id        unique within this file (stored as "x:<id>")
#   label     what the app shows
#   kind      tool | method | domain | cert
#   aliases   matched in any case, as whole words
#   exact     matched only as written: acronyms, and names that are also
#             everyday words ("SOC", "Epic", "Spark")
#   same_as   vocabulary.toml ids this term is the same skill as; when the
#             profile's vocabulary has one, these names are added to it
#             instead of making a second term
#
# Matching is by whole tokens, so "soc 2" does not need "soc2" spelled as a
# regex; list each spelling a posting uses.

