# MASTER CONTENT -- every truthful statement the candidate can make.
#
# This is Wren Adeyemi, who does not exist. Everything below is invented, and
# it is invented in accounting rather than analytics on purpose: an example
# built in the author's own field would let those assumptions hide inside the
# machinery. If the engine can tailor an AP clerk's resume, the engine is
# general.
#
# Tailoring is SELECTION, ORDERING and VARIANT CHOICE over this file. It never
# writes a new claim and it never edits the text of one. That is the whole
# ethical basis of the tool: a tailored resume is a subset of this file, so
# nothing on it can be untrue unless something here is untrue.
#
# Rules for editing this file (enforced by `py -m jobdesk.engine.main check`):
#   * every `tags` entry must be a term id in vocabulary.toml
#   * a variant may REWORD its bullet, never add a fact. Checked mechanically
#     by requiring the variant's numbers to be a subset of the base bullet's,
#     because invented metrics are the failure mode that actually gets someone
#     caught.
#   * `draft = true` means "not confirmed yet". Drafts are excluded from every
#     rendered resume unless --include-draft is passed explicitly.
#
# Fields on [[bullet]]:
#   id       unique, dotted, stable (it appears in the tailoring report)
#   parent   an [[experience]] or [[project]] id
#   tags     vocabulary term ids this bullet genuinely demonstrates
#   priority tie-break when coverage is equal (higher wins)
#   text     the default phrasing, what is on the live resume today

# ---------------------------------------------------------------------------
