# Canonical skill/method vocabulary.
#
# ONE list, used for two jobs that have to agree:
#   1. reading a job description  (JD text -> canonical term ids)
#   2. tagging master content     (bullet `tags` -> the same term ids)
#
# If those two used different words, tailoring would silently match nothing.
# `py -m jobdesk.engine.main check` fails on any bullet tag that is not an id
# here, which is the only thing keeping the two halves in sync.
#
# `aliases` is where JD-vocabulary mirroring lives. A posting that says
# "three-way match" and a bullet that says "matched invoices against POs and
# receipts" are the same canonical term, so the bullet gets credit without
# anyone rewriting a true statement into a false one.
#
# Matching is case-insensitive, on word boundaries, over the JD text. Short
# aliases are dangerous: "ap" fires inside "apply" and "approach", so the AP
# term below spells the phrases out.
#
# `kind`: tool | method | soft | domain
#   tool   -> can appear in the SKILLS section and is worth leading with
#   method -> what the work IS; matched against bullets, never invented
#   soft   -> counted for the gap report, deliberately NOT used to pick bullets
#   domain -> industry context; drives the summary's closing clause only

