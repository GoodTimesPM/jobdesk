# Who you are targeting, expressed as scoring inputs.
#
# This is Wren Adeyemi, who does not exist: an early-career accounting and
# financial-operations candidate in Denver. Nothing here overlaps with the
# person who built JobDesk, and that is the point. If the radar can score a
# Denver AP clerk role for a fictional accountant using the same machinery
# that scores a Richmond analyst role, then the machinery is machinery and the
# profile is data.
#
# It is also the test fixture. JOBDESK_PROFILE pointed at this directory is
# what tests/test_profile.py runs against, so this file cannot quietly rot.
#
# Copy the whole directory to `profile/` and edit it. Every value is a plain
# TOML list. Nothing here needs Python and nothing here needs a model.

