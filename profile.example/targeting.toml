# --------------------------------------------------------------------------
# Experience and compensation thresholds.
# --------------------------------------------------------------------------

# Up to years_comfortable is in range. Up to max_years_stretch is a demoted
# stretch. Above max_years_stretch is a HARD BLOCK, never surfaced. This is
# the single biggest noise filter in the whole engine: a recruiter will not
# look past a candidate who is years short of a stated minimum.
years_comfortable = 2
max_years_stretch = 3

# The standard HR escape hatch. "5 years of experience OR an equivalent
# combination of education and experience" is not a 5-year gate. One of these
# phrases downgrades the hard block to the ordinary out-of-range penalty, so
# the posting is demoted rather than erased.
#
# But only up to a point. Against a 10-year requirement it is boilerplate that
# got pasted in, and treating it as an opening would undo the filter the block
# exists to be.
equivalency_ceiling = 6

equivalency_phrases = [
  "or equivalent combination", "an equivalent combination",
  "or equivalent experience", "or equivalent education",
  "or equivalent work experience", "or related experience",
  "combination of education and experience",
]

# Explicit "we will teach you" signals. These also disarm the years block: a
# posting that says it will train cannot simultaneously mean its years line
# as a gate.
no_experience_phrases = [
  "no experience necessary", "no experience required", "no prior experience",
  "will train", "training provided", "paid training", "on-the-job training",
  "entry level position", "entry-level position", "0-2 years", "0-1 year",
  "1-2 years", "recent graduate", "new graduate", "no minimum experience",
]

