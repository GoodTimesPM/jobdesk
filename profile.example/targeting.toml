# --------------------------------------------------------------------------
# Title decomposition: FUNCTION x LEVEL.
#
# The tier lists above are a closed vocabulary. A title that is not on one of
# them scores zero and gets capped below the reporting threshold, which is a
# hard ceiling on recall that no amount of list-padding fixes. These families
# match a title whose separators ("/", "&", "-", ",") have been flattened to
# spaces, so "Accounts Payable/Receivable Clerk" reads correctly.
#
# Scoring takes max(tier points, family points), so adding a family can only
# help. Nothing that scores today can regress.
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# What the keyword boards get asked for.
#
# Adzuna and USAJOBS take a phrase, not a taxonomy, and each phrase is a round
# trip, so this is a short list rather than the whole tier-1 set. Omit the key
# and the top of tier 1 is used instead.
search_queries = [
  "staff accountant", "accounts payable", "accounts receivable",
  "bookkeeper", "payroll specialist", "billing specialist",
  "accounting associate",
]

# Workday is queried one `searchText` at a time rather than pulled wholesale,
# because the list response has no body and the years parse needs a second
# call per posting. Each query costs one HTTP call and returns one page of
# twenty, ranked by relevance, so a phrase is worth writing down: against a
# live tenant "analyst" returns 298 postings and "data analyst" 209, and the
# top twenty of each are different postings. (This used to say single words
# only, on the belief that Workday ANDs a phrase and returns nothing. It
# does not.) The synonym table widens whatever is here. Omit the key and one
# word per function family is derived instead.
workday_search_terms = ["accountant", "staff accountant", "payroll",
                        "billing", "audit", "accounts payable",
                        "accounts receivable", "bookkeeper"]

# --------------------------------------------------------------------------
# EXPERIMENTAL: synonyms.
#
# The tier lists above are your vocabulary. The posting was written by
# somebody who never saw them. "Accounting Associate" and "Finance Operations
# Associate" are the same job, and a req asking for NetSuite experience is
# asking for an ERP you already know. This section says so once, and the
# radar reads it in three places: the title score, the skill score, and the
# search queries it sends to the boards.
#
# `for` must be a string that appears in one of the tier lists (a title
# synonym) or a key in [core_skills] / [supporting_skills] (a skill synonym).
# Anything else is ignored, so a typo is quiet rather than fatal.
#
# Two rules:
#
#   * A TITLE synonym is worth `synonym_discount` less than the term it
#     stands in for. It is a guess about wording, so it should lose to an
#     exact hit rather than tie with one.
#   * A SKILL synonym is worth full weight. A tool is a tool.
#
# Matching is plain substring, same as the skill table, so nothing shorter
# than about five characters belongs here.
#
# Set `synonyms_enabled = false` to switch the whole layer off in one line.
# --------------------------------------------------------------------------
synonyms_enabled = true

# Points shaved off a tier hit reached by synonym. 6 puts a tier-1 synonym
# above a tier-2 exact hit and below a tier-1 exact hit, which is the order
# you want: a strong guess beats a weak certainty.
synonym_discount = 6

# How many extra board queries the synonym layer may add on top of
# `search_queries`. Each one is an HTTP round trip per board, so it is a
# budget, not a preference.
search_synonym_limit = 8

